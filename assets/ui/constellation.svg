<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Secondary inner symmetry lines (opacity 0.45) -->
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.45">
    <line x1="64" y1="24" x2="64" y2="104"/>
    <line x1="34" y1="62" x2="94" y2="62"/>
    <line x1="46" y1="44" x2="82" y2="44"/>
  </g>
  <!-- Primary symmetrical diamond constellation (opacity 0.9) -->
  <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <polygon points="64,24 94,62 64,104 34,62"/>
    <polyline points="46,44 64,52 82,44"/>
  </g>
  <!-- Secondary stars -->
  <g fill="currentColor" opacity="0.45">
    <circle cx="46" cy="44" r="2.2"/>
    <circle cx="82" cy="44" r="2.2"/>
  </g>
  <!-- Primary stars + main star slightly above center (64, 52) -->
  <g fill="currentColor" opacity="0.9">
    <circle cx="64" cy="24" r="2.5"/>
    <circle cx="94" cy="62" r="2.5"/>
    <circle cx="64" cy="104" r="2.5"/>
    <circle cx="34" cy="62" r="2.5"/>
    <!-- Main star -->
    <circle cx="64" cy="52" r="3.8"/>
    <circle cx="64" cy="52" r="6.4" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45"/>
  </g>
</svg>
