appId: com.entropynexus.vault
productName: Entropy Nexus Vault
asar: true
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
extraResources:
  - from: node_modules/@fontsource-variable/noto-serif-tc/LICENSE
    to: licenses/noto-serif-tc.txt
  - from: node_modules/@fontsource-variable/noto-sans-tc/LICENSE
    to: licenses/noto-sans-tc.txt
  - from: node_modules/@fontsource-variable/jetbrains-mono/LICENSE
    to: licenses/jetbrains-mono.txt
win:
  icon: assets/icon/app.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Entropy-Nexus-Vault-Setup-${version}.${ext}
publish: null
# Refuse development-mode output (M5b review S7); see scripts/verify-production-build.cjs.
beforePack: scripts/verify-production-build.cjs
# Verify the assembled ASAR and its companion licenses before emitting a distribution.
afterPack: scripts/verify-packaged-app.cjs
